<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My 10-Minute Movement Week</title><style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#24362f;background:#f6f7f2}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:24px 18px 60px}header{margin-bottom:22px}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#66806e;font-weight:800}h1{font-size:clamp(28px,6vw,42px);letter-spacing:-.04em;margin:8px 0}p{line-height:1.5}.sub{color:#65766c;margin:0}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:24px 0 18px}.day{border:1px solid #dbe5da;background:white;border-radius:13px;padding:13px 2px;cursor:pointer;font-size:14px;font-weight:800;color:#4e6656}.day[aria-selected=true]{background:#234d3c;color:white;border-color:#234d3c}.day:focus-visible,button:focus-visible{outline:3px solid #c68c44;outline-offset:3px}.panel{background:white;border:1px solid #e0e7df;border-radius:22px;padding:24px;box-shadow:0 10px 30px #24362f0b}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.pill{font-size:12px;border-radius:100px;padding:7px 11px;background:#eaf1e9;color:#305b44;font-weight:800}h2{font-size:27px;margin:13px 0 7px;letter-spacing:-.025em}.meta{color:#65766c;font-size:14px}.instructions{padding:14px 16px;background:#f3f6f1;border-radius:12px;font-size:14px;margin:18px 0}.moves{list-style:none;padding:0;margin:0}.move{display:flex;gap:14px;align-items:flex-start;padding:17px 0;border-top:1px solid #ecf0ea}.num{flex:0 0 34px;height:34px;border-radius:11px;background:#eaf1e9;display:grid;place-items:center;color:#356048;font-weight:800}.move h3{font-size:16px;margin:1px 0 5px}.move p{margin:0;color:#65766c;font-size:13px}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.nav button,.timer button,.today{background:#234d3c;color:white;border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer}.nav button{flex:1}.nav button:first-child{background:#eaf1e9;color:#234d3c}.timer{margin-top:18px;padding:18px;background:#eaf1e9;border-radius:17px}.timer .clock{font-variant-numeric:tabular-nums;font-size:42px;font-weight:850;letter-spacing:-.05em;margin:8px 0}.timer .phase{font-weight:800}.timer .tiny{font-size:13px;color:#5c7465}.timer .controls{display:flex;gap:9px;flex-wrap:wrap}.timer button{padding:10px 14px}.timer button.secondary{background:white;color:#234d3c}.footer{color:#708077;font-size:13px;margin-top:18px}.check{display:flex;align-items:center;gap:9px;margin-top:18px;font-size:14px;font-weight:700}.check input{width:19px;height:19px;accent-color:#234d3c}@media(max-width:420px){.panel{padding:18px}.day{font-size:12px;padding:12px 0}}
</style></head><body><main><header><div class="eyebrow">Move with purpose 🌿</div><h1>My 10-minute movement week</h1><p class="sub">Strength, mobility, and deep core. Pick a day, see the moves, and get going. No extra pressure.</p></header><div class="week" role="tablist" aria-label="Choose workout day" id="tabs"></div><section class="panel" id="panel" aria-live="polite"></section><p class="footer">A partial workout still counts as movement. Adjust any exercise that causes pain. Your goal is long-term comfort, fluid movement, and capability.</p></main><script>
const days=[
{short:'Mon',day:'Monday',type:'Strength A',tag:'Functional whole-body strength',mode:'circuit',moves:[['Goblet squats','Hold a weight at your chest; sit down and stand tall.'],['Glute bridges','Drive through your heels; squeeze glutes at the top.'],['Floor push-ups','Use knees or an incline as needed.'],['Band rows','Pull elbows back and gently squeeze shoulder blades.'],['Suitcase carries','Carry a weight on one side; switch sides halfway.']]},
{short:'Tue',day:'Tuesday',type:'Mobility A',tag:'Hips and rotation',mode:'blocks',moves:[['90/90 hip switches + lift-offs','2 min total. Move between hip positions; add controlled lift-offs.'],['Cossack squats','2 min total. Shift side to side within a comfortable range.'],['Knee-over-toe split squat rocks','1 min per side. Slowly drive knee forward over toes.'],['Standing figure-four squats','1 min per side. Use a wall or chair for balance.'],['Open-book rotations + shoulder CARs','1 min each; alternate sides. Rotate gently and slowly.']]},
{short:'Wed',day:'Wednesday',type:'Core A',tag:'Deep core control',mode:'blocks',moves:[['Dead bug breathing','2 min. Exhale fully and keep ribs stacked over pelvis.'],['Tabletop toe taps','2 min. Lower one foot at a time without arching back.'],['Reverse crunches','2 min. Curl pelvis gently, without swinging legs.'],['Side planks','1 min per side, including rests. Modify from knees.'],['Single-leg glute bridge holds','1 min per side, including rests. Keep hips level.']]},
{short:'Thu',day:'Thursday',type:'Mobility B',tag:'Spine, shoulders, wrists, hips',mode:'blocks',moves:[['Segmented cat-cow','2 min. Slowly move through the spine, one segment at a time.'],['Shoulder CARs + 90/90 band rotations','2 min. Slow controlled shoulder circles and rotations.'],['Scapular push-ups','2 min. Keep arms mostly straight; move shoulder blades.'],['Reverse-hand wrist rocks + palm lifts','2 min. Gentle wrist loading, then controlled palm lifts.'],['Active hip flexor lunges + side-body reaches','2 min. Alternate sides and reach upward.']]},
{short:'Fri',day:'Friday',type:'Strength B',tag:'Functional whole-body strength',mode:'circuit',moves:[['Reverse lunges','Switch sides during the interval.'],['Single-leg Romanian deadlifts','Switch sides; use a wall or chair for support.'],['Overhead presses','Press weights overhead without arching back.'],['Reverse flyes','Use light resistance; open arms with control.'],['Single-leg balance','Switch sides halfway; use support if needed.']]},
{short:'Sat',day:'Saturday',type:'Core B',tag:'Deep core and stability',mode:'blocks',moves:[['Supine bracing breaths','2 min. Breathe into your ribs and brace gently.'],['Bird dog knee-to-elbow','2 min. Alternate sides; resist torso rotation.'],['Bear plank shoulder taps','2 min. Keep knees low; tap shoulders with control.'],['Side plank hip lifts','1 min per side, including rests. Modify from knees.'],['Hollow-body holds','2 min. Use 10–20-second holds with rests; tuck knees if needed.']]},
{short:'Sun',day:'Sunday',type:'Mobility C',tag:'Balance and full-body mobility',mode:'blocks',moves:[['Hip airplanes','1 min per side. Hold onto support for balance.'],['Deep squat shifts + ankle CARs','2 min. Shift gently and rotate ankles.'],['90/90 lift-offs + active hip flexor lunges','2 min. Alternate between controlled hip movements.'],['Open-book rotations + side-body reaches','2 min. Alternate sides.'],['Forearm rotations + scapular push-ups','2 min. Move slowly and deliberately.']]}
];
let selected=(new Date().getDay()+6)%7,elapsed=0,run=false,tick=null;const tabs=document.getElementById('tabs'),panel=document.getElementById('panel');
function phase(d,t){if(t>=600)return {label:'Complete 🎉',remaining:0,move:'Done'};if(d.mode==='blocks'){const n=Math.floor(t/120);return {label:`Block ${n+1} of 5`,remaining:120-t%120,move:d.moves[n][0]}}const s=t%60,n=Math.floor(t/60)%5,round=Math.floor(t/300)+1;return {label:`Round ${round} · ${s<40?'Move':'Transition'}`,remaining:(s<40?40:60)-s,move:d.moves[n][0]}}
function fmt(n){return `${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`}
function render(){const d=days[selected];tabs.innerHTML=days.map((x,i)=>`<button class="day" role="tab" aria-selected="${i===selected}" onclick="selectDay(${i})">${x.short}</button>`).join('');panel.innerHTML=`<div class="topline"><span class="pill">${d.day}</span><span class="meta">10 minutes</span></div><h2>${d.type}</h2><div class="meta">${d.tag}</div><div class="instructions">${d.mode==='circuit'?'<strong>Format:</strong> 40 seconds moving + 20 seconds transition per exercise. Repeat all 5 moves twice.':'<strong>Format:</strong> 2 minutes per block. Work slowly and with control; rest or switch sides as noted.'}</div><ol class="moves">${d.moves.map((m,i)=>`<li class="move"><div class="num">${i+1}</div><div><h3>${m[0]}</h3><p>${m[1]}</p></div></li>`).join('')}</ol><div class="timer"><div class="tiny">Optional guided timer</div><div class="clock" id="clock">${fmt(600-elapsed)}</div><div class="phase" id="phase"></div><div class="tiny" id="current"></div><div class="controls" style="margin-top:12px"><button id="start" onclick="toggleTimer()">${run?'Pause':'Start'}</button><button class="secondary" onclick="resetTimer()">Reset</button></div></div><label class="check"><input type="checkbox" id="done" onchange="saveDone(this.checked)"> Mark today's workout complete</label><div class="nav"><button onclick="selectDay((${selected}+6)%7)">← Previous</button><button onclick="selectDay((${selected}+1)%7)">Next →</button></div>`;document.getElementById('done').checked=localStorage.getItem('done-'+dateKey(selected))==='yes';updateTimer()}
function dateKey(i){const now=new Date(),monday=new Date(now);monday.setDate(now.getDate()-((now.getDay()+6)%7)+i);return [monday.getFullYear(),monday.getMonth()+1,monday.getDate()].join('-')}
function saveDone(v){localStorage.setItem('done-'+dateKey(selected),v?'yes':'no')}
function selectDay(i){pause();elapsed=0;selected=i;render()}
function updateTimer(){const p=phase(days[selected],elapsed);document.getElementById('clock').textContent=fmt(600-elapsed);document.getElementById('phase').textContent=p.label+' · '+fmt(p.remaining)+' left';document.getElementById('current').textContent=p.move;document.getElementById('start').textContent=run?'Pause':elapsed>=600?'Restart':'Start'}
function pause(){run=false;if(tick)clearInterval(tick);tick=null}
function toggleTimer(){if(elapsed>=600)elapsed=0;if(run){pause();updateTimer();return}run=true;let last=Date.now();tick=setInterval(()=>{const now=Date.now(),delta=Math.max(1,Math.floor((now-last)/1000));if(now-last<1000)return;last+=delta*1000;elapsed=Math.min(600,elapsed+delta);if(elapsed>=600)pause();updateTimer()},250);updateTimer()}
function resetTimer(){pause();elapsed=0;updateTimer()}render();
</script></body></html>
